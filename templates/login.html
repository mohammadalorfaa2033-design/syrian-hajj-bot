<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - لوحة التحكم</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    padding: 2rem;
    border-radius: 12px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  h1 { font-size: 1.25rem; margin: 0 0 1.25rem; text-align: center; }
  input {
    width: 100%;
    padding: .65rem .8rem;
    margin-bottom: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: .65rem;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .error { color: #f87171; text-align: center; margin-bottom: 1rem; font-size: .9rem; }
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>لوحة تحكم البوت</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="كلمة المرور" required autofocus>
    <button type="submit">دخول</button>
  </form>
</body>
</html>
